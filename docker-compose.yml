name: saveb-admin-production
services:
  web:
    # 服务器只运行云端构建的镜像，缺少版本时直接报错。
    image: ${RELEASE_IMAGE:?Set RELEASE_IMAGE to the pulled GHCR image}
    restart: unless-stopped
    ports: ["${ADMIN_BIND_IP:-127.0.0.1}:${ADMIN_PORT:-13000}:80"]
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    networks: [business]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz && wget -q -O /dev/null http://127.0.0.1/backend-health"]
      interval: 10s
      timeout: 5s
      retries: 10
networks:
  business:
    external: true
    name: ${DEPLOY_NETWORK:-saveb-production}

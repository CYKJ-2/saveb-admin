services:
  web:
    image: ${RELEASE_IMAGE:?immutable image required}
    restart: unless-stopped
    ports: ["127.0.0.1:${ADMIN_PORT:-18000}:80"]
    networks: [business]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz && wget -q -O /dev/null http://127.0.0.1/backend-health"]
      interval: 10s
      timeout: 5s
      retries: 10
networks:
  business:
    external: true
    name: ${DEPLOY_NETWORK:-saveb-production}
